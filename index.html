<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real-Time P2P Item Tosser</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: none; /* Prevents mobile browser pull-to-refresh */
        }
        #setup-zone {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
            width: 350px;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        textarea {
            width: 100%; height: 70px; background: #333; color: #fff; border: 1px solid #444; margin: 8px 0; font-family: monospace; resize: none; box-sizing: border-box; padding: 5px;
        }
        button {
            background: #007bff; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 5px; font-size: 15px;
        }
        button:hover { background: #0056b3; }
        #canvas-stage {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none;
        }
        .ball {
            position: absolute; width: 70px; height: 70px; background: radial-gradient(circle at 30% 30%, #ff4b4b, #a30000);
            border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: grab; user-select: none; z-index: 5;
        }
        .ball:active { cursor: grabbing; }
        .status-pill {
            position: absolute; top: 20px; background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 20px; font-size: 14px; z-index: 10;
        }
        label { display: block; text-align: left; font-size: 12px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="status-pill" id="status">Setup Connection Below</div>

    <!-- Step 1: WebRTC Handshake Layout -->
    <div id="setup-zone">
        <h3 style="margin-top:0;">⚡ Real-Time P2P Tosser</h3>
        <button id="btn-device-a">I am Device A (Sender)</button>
        <button id="btn-device-b" style="background:#28a745; margin-top:10px;">I am Device B (Receiver)</button>
        
        <div id="signaling" style="display:none; margin-top:15px;">
            <p id="instruction" style="font-size:14px; margin: 5px 0; color:#ddd;"></p>
            <label>Your connection code (Tap to copy):</label>
            <textarea id="local-sdp" readonly onclick="this.select(); document.execCommand('copy'); alert('Copied code!');"></textarea>
            <label>Paste peer code here:</label>
            <textarea id="remote-sdp" placeholder="Paste code here..."></textarea>
            <button id="btn-connect" style="background:#ffc107; color:#111;">Link Screens</button>
        </div>
    </div>

    <!-- Step 2: The Shared Arena -->
    <div id="canvas-stage">
        <div id="toss-ball" class="ball"></div>
    </div>

<script>
    const config = { iceServers: [{ urls: 'stun:://google.com' }] };
    let pc = new RTCPeerConnection(config);
    let dataChannel;
    let isDeviceA = false;

    // Physics state tracking
    const ball = document.getElementById('toss-ball');
    const stage = document.getElementById('canvas-stage');
    const status = document.getElementById('status');
    let isDragging = false;
    let startY = 0, currentY = 0, startTime = 0, endTime = 0;

    // WebRTC Setup Triggers
    document.getElementById('btn-device-a').addEventListener('click', async () => {
        isDeviceA = true;
        initSignaling("1. Copy YOUR code, send it to B. Then paste B's code below.");
        dataChannel = pc.createDataChannel("tossChannel");
        bindChannel(dataChannel);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
    });

    document.getElementById('btn-device-b').addEventListener('click', () => {
        isDeviceA = false;
        initSignaling("1. Paste A's code below, hit Link, then copy YOUR code back to A.");
        pc.ondatachannel = (e) => { dataChannel = e.channel; bindChannel(dataChannel); };
    });

    function initSignaling(text) {
        document.getElementById('btn-device-a').style.display = 'none';
        document.getElementById('btn-device-b').style.display = 'none';
        document.getElementById('signaling').style.display = 'block';
        document.getElementById('instruction').innerText = text;
    }

    pc.onicecandidate = e => { 
        if(!e.candidate) {
            document.getElementById('local-sdp').value = btoa(JSON.stringify(pc.localDescription));
        } 
    };

    document.getElementById('btn-connect').addEventListener('click', async () => {
        const raw = document.getElementById('remote-sdp').value.trim();
        if(!raw) return alert("Please paste the connection code!");
        try {
            const desc = new RTCSessionDescription(JSON.parse(atob(raw)));
            await pc.setRemoteDescription(desc);
            if(!isDeviceA && pc.remoteDescription.type === 'offer') {
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
            }
        } catch(e) {
            alert("Error parsing connection code. Make sure you copied the whole block.");
        }
    });

    function bindChannel(channel) {
        channel.onopen = () => {
            document.getElementById('setup-zone').style.display = 'none';
            stage.style.display = 'block';
            status.innerText = "🟢 Connected! Ready to toss.";
            
            if(isDeviceA) {
                spawnBall(window.innerWidth / 2 - 35, window.innerHeight - 150);
            } else {
                ball.style.display = 'none';
            }
        };

        channel.onmessage = e => {
            const msg = JSON.parse(e.data);
            if(msg.type === 'toss-enter') {
                status.innerText = "🫴 Caught it!";
                // Spawn ball precisely relative to screen size width entry footprint
                spawnBall(msg.x * window.innerWidth, -70);
                
                ball.style.transition = "top 0.4s cubic-bezier(0.1, 0.8, 0.3, 1)";
                setTimeout(() => {
                    ball.style.top = (window.innerHeight / 2 - 35) + "px";
                }, 50);
            }
        };
    }

    function spawnBall(x, y) {
        ball.style.transition = "none";
        ball.style.display = 'block';
        ball.style.left = x + 'px';
        ball.style.top = y + 'px';
    }

    // Unified Event Normalizer (Extracts coords from Mouse or Touch)
    function getPointerCoords(e) {
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
    }

    // Drag Interaction Logic
    function startDrag(e) {
        isDragging = true;
        ball.style.transition = "none";
        const coords = getPointerCoords(e);
        startY = coords.y;
        startTime = performance.now();
    }

    function drag(e) {
        if(!isDragging) return;
        e.preventDefault(); // Stop mobile scrolling while throwing
        const coords = getPointerCoords(e);
        currentY = coords.y;
        ball.style.top = (currentY - 35) + 'px';
        ball.style.left = (coords.x - 35) + 'px';
    }

    function endDrag(e) {
        if(!isDragging) return;
        isDragging = false;
        endTime = performance.now();

        const distanceY = startY - currentY;
        const duration = endTime - startTime;
        const velocity = distanceY / duration; // Velocity evaluation

        // Toss threshold checked
        if(velocity > 0.4 && currentY < startY) {
            status.innerText = "🚀 Tossing...";
            ball.style.transition = "top 0.2s ease-in";
            ball.style.top = "-100px";

            const relativeX = parseFloat(ball.style.left) / window.innerWidth;

            setTimeout(() => {
                ball.style.display = 'none';
                if(dataChannel && dataChannel.readyState === "open") {
                    dataChannel.send(JSON.stringify({ type: 'toss-enter', x: relativeX }));
                }
            }, 200);
        } else {
            // Bounce ball back home if drag velocity is too slow
            ball.style.transition = "top 0.2s ease-out, left 0.2s ease-out";
            ball.style.top = (window.innerHeight - 150) + "px";
            ball.style.left = (window.innerWidth / 2 - 35) + "px";
        }
    }

    // Event Listeners for both Desktop & Mobile Touch
    ball.addEventListener('mousedown', startDrag);
    ball.addEventListener('touchstart', startDrag, { passive: false });

    window.addEventListener('mousemove', drag);
    window.addEventListener('touchmove', drag, { passive: false });

    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);
</script>
</body>
</html>
